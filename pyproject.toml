[project]
name = "creative-writer"
version = "0.1.0"
description = "File-first tooling for collaborative human-AI fiction writing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11.3",
  "PyYAML>=6.0.2",
]

[project.scripts]
creative-writer = "creative_writer.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_writer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
