title: "Chapter III calibration"
purpose: "Test whether the first sustained spoken expedition account sounds like Wells in 1895, with all other considerations subordinate to that judgement."
entries:
  - id: travel-under-the-rock
    label: "The first advance from the refuge"
    manuscript: "manuscript/03-the-first-intervals.md"
    start_line: 63
    end_line: 96
    kind: confidence
    question: "Does the movement from apprehension beneath the rock to the obscured plain sound like the particular Traveller, rather than an author deliberately supplying him with irrational reactions?"
    context: "Compare the bodily sensations and changing attention in The Time Machine III. The rock remains intact; fear of rematerialisation and a minor knock add cost without using a machinery failure or anticipating the later collapse."
  - id: the-unmarked-stake
    label: "An absence becomes a conviction"
    manuscript: "manuscript/03-the-first-intervals.md"
    start_line: 118
    end_line: 134
    kind: confidence
    question: "Does the Traveller's pleasure in the absent flood-mark make his premature conviction persuasive in Wells's voice, without the retrospective speaker either silently certifying it or explaining away the mistake too soon?"
    context: "Fable planted the conviction in Chapter II and endorsed this passage in board thread 16, message 62; it is preserved word for word. The lack of a surviving mark cannot establish that water never rose during thirteen unobserved months. The Geologist retains that objection for Chapter VI. Compare the enjoyed explanatory construction in The Time Machine IV, not just its final correction."
  - id: an-imagined-river-course
    label: "An enjoyed explanation, the pencil, and the room"
    manuscript: "manuscript/03-the-first-intervals.md"
    start_line: 136
    end_line: 204
    kind: uncertainty
    question: "Does the revised middle now let the Traveller's thinking gather Wellsian momentum, with the pencil and brief audience question interrupting an absorbed man rather than supplying calculated changes of pace?"
    context: "Revised after Fable's critique in board thread 16, message 62. False water patches, repeated pacing and the blowing label are removed. The upstream diversion is imagined; he has not traced the river into the lake, and his search from the cairn finds no new course. Compare the sustained construction of a theory in The Time Machine IV and the changing attention in III. The sole outer-narrator intrusion within the original III–XI is the silent flower exhibit in VII: the thermometer question is a local choice for this meeting, not a claimed Wells requirement. The scrub sentence lets observation complicate the new explanation without disposing of it."
  - id: the-opposite-bank
    label: "The glass brings the animal closer"
    manuscript: "manuscript/03-the-first-intervals.md"
    start_line: 215
    end_line: 235
    kind: confidence
    question: "Does the animal scene combine observation, bodily apprehension and the Traveller's uneven attention in a convincing 1895 voice while keeping the predator an ordinary animal?"
    context: "The scar is seen briefly, identity is inferred, the animal drinks for a long time and watches from the opposite bank. It does not cross until Station III. The camera is left behind, so this encounter produces no identifying photograph. The climate quip is replaced by his looking for a shallow crossing; the earlier almost-offensive animal indifference stays."
  - id: the-warm-refuge
    label: "Work, a sleepless night, and another interval"
    manuscript: "manuscript/03-the-first-intervals.md"
    start_line: 237
    end_line: 272
    kind: uncertainty
    question: "Does the warmer night and the Traveller's contradictory hope and expectation carry him into another advance in Wells's voice, with the plain departure earning its place as the chapter ending?"
    context: "The working visit lasts about one day and night. The final hear/see antithesis is removed; he starts the machine. The plumb stays hanging and must still be unaltered at Station III, as Chapter II explicitly records. Ten further months reach about twenty-three months beyond baseline; fuller seasonal water might re-enter even a deserted channel, so the test remains intelligible under his new theory. The note about food limits waiting without creating an immediate starvation crisis."
