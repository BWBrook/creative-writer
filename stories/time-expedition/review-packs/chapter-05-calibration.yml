title: "Chapter V calibration"
purpose: "Retain five calibration passages for Barry's read after Fable's passed retest: does the waiting, crisis and return truly sound like Wells's Traveller in 1895? His presence as a speaker remains central; continuity and diagnostics support that judgement."
# Fable passed the revision in message 486, thread 52, subject to two local
# repairs, now complete: fold the vocative into the garden question and restore
# the failed lift that makes dragging the case an alternative. No further
# collaborator critique cycle is needed; Barry's read remains. The small animal,
# delirium, plumb and unfinished fate are preserved.
# The Time Machine X supports a short gait within the fight; XII restores the
# teller's relation to his listeners during the return. Monitor those functions
# and the accumulated first-person observation phrases, not punctuation quotas
# or a sentence-length percentile. Dismiss the local
# 'seemed' locators: fatigue, photographic dissatisfaction, uncertain graze and
# perception during travel need their qualifications. Dismiss the ordinary
# connective/object phrases and generic 'mark', 'side to side', 'whether ... or'
# and 'take shape' findings in context. No profile change is warranted.
entries:
  - id: waiting-and-the-rain
    label: "The falling glass, the little animal and the rain"
    manuscript: "manuscript/05-the-refuge.md"
    start_line: 1
    end_line: 62
    kind: confidence
    question: "Does the unrecorded aneroid reading restore the man speaking to the room while leaving the waiting, uneven sympathy and bodily relief in Wells's voice?"
    context: "Reported account. Compare The Time Machine IX and XII for shifts between remembered experience and present telling. The new aside admits what he cannot supply, instead of decorating the account with an address. The notebook still ends at 'I shall stay.' Fable passed the little animal; that paragraph is unchanged. The rain no longer receives a modern emotional summary. The first afternoon and second morning are lived time."
  - id: the-river-and-its-load
    label: "The rain carries away the path"
    manuscript: "manuscript/05-the-refuge.md"
    start_line: 64
    end_line: 118
    kind: confidence
    question: "Does the widening view of runoff, unfamiliar trees and displaced animals retain the movement of Wells's observed catastrophe as the revised waiting leads into it?"
    context: "Fable passed this sequence, including the delirium, and its prose is unchanged. The Time Machine III and IX govern attention and cadence; the danger-and-action packet supplies bounded comparison. The floating trees come from unseen country. The new channel is witnessed locally, and neither it nor the lost stake proves what happened during the thirteen-month absence. No new explanatory sentence settles that argument before VI."
  - id: the-animal-in-the-cleft
    label: "Four charges and the quartz rod"
    manuscript: "manuscript/05-the-refuge.md"
    start_line: 138
    end_line: 178
    kind: confidence
    question: "Do the deliberate draw, the wounded animal's flight into shelter and the Traveller's fear for the quartz rod carry the encounter in Wells's voice without explaining its mechanics too insistently?"
    context: "Danger-action, under The Time Machine VI, IX and X. The two-foot clearance is stated without assuming the Society heard the private notebook reading. Two shots are fired; four charges remain loaded and six in reserve. The gun works, but the machine lies beyond the beast. The quartz rod belongs to established machine continuity; the added fear concerns being stranded, not a new unique function for the rod. The plumb paragraph is unchanged."
  - id: clearing-the-machine
    label: "The cases, the hand and the levers"
    manuscript: "manuscript/05-the-refuge.md"
    start_line: 188
    end_line: 244
    kind: confidence
    question: "Do the few joined movements in clearing the machine vary the attention naturally while preserving the short, bodily urgency that Wells allows inside his fight?"
    context: "The Time Machine X is the closest cadence comparison, with VI and IX providing further action contexts. No audience interruption has been inserted into the close work. He clears material obstructions before travelling; his revolver returns in its case and the separately secured proof survives. The animal tries the obstructed left route. Neither the complete collapse nor its fate is witnessed; the closing thought about leaving enough years behind him is unchanged."
  - id: the-forty-yards
    label: "The stranger's lawn and the closed windows"
    manuscript: "manuscript/05-the-refuge.md"
    start_line: 246
    end_line: 279
    kind: confidence
    question: "Does the renewed address sound like Wells's exhausted Traveller acknowledging the oddity of his escape, with the afternoon's hauling felt through the shadow and the piano?"
    context: "The Time Machine XII governs both the return cadence and the preserved spatial displacement. The Richmond stop restores the forty yards by physical hauling before the laboratory exists. The revision gives that work most of an afternoon and lets the speaker wonder why nobody challenged him. The bee, piano, bandages and clock remain. It adds no lateral machine power or account of vertical anchoring; VI retains the examination. Test whether the address belongs to this man's telling rather than announcing the repair."
