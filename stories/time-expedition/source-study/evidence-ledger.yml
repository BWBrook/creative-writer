    scope_and_limits: >-
      Development-only cross_work scope is limited to the selected reported first-person, sustained-dialogue, and essay passages across the-time-machine, the-invisible-man, and certain-personal-matters. Role and work are aliased, so the contrasts do not identify a role effect. The Invisible Man transcription is not a diplomatic book witness, and serial and book paragraphing may differ; paragraph-level claims remain provisional.
