schema_version: 1
study_id: time-expedition-wells-phase-2b
stage: validated
mode: descriptive
claims:
  - id: mediated-testimony-frame
    dimension: frame-architecture
    statement: >-
      Across the primary frame and selected short fiction, extraordinary events are mediated through visible acts of testimony, transcription, or evidentiary assessment, allowing credibility and uncertainty to coexist.
    jurisdiction:
      scope: cross_work
      roles:
        - frame architecture
        - testimony
      eligible_witness_ids:
        - the-time-machine
        - selected-short-fiction/the-plattner-story
        - selected-short-fiction/the-crystal-egg
    classification: wells_characteristic_but_shared
    status: validated
    confidence: moderate
    supporting_passages:
      - witness_id: the-time-machine
        source_id: the-time-machine
        selection_id: null
        passage_id: the-time-machine:ii:101:b859a93fec21
        authority_tier: 1
        evidence_role: support
        relevance_note: >-
          The primary frame presents extraordinary testimony within a visible social and evidentiary setting.
      - witness_id: selected-short-fiction/the-plattner-story
        source_id: selected-short-fiction
        selection_id: the-plattner-story
        passage_id: selected-short-fiction/the-plattner-story:the-plattner-story:1:725f01ec6e50
        authority_tier: 2
        evidence_role: support
        relevance_note: >-
          The selected story opens its other-world account through a bounded testimony frame.
      - witness_id: selected-short-fiction/the-crystal-egg
        source_id: selected-short-fiction
        selection_id: the-crystal-egg
        passage_id: selected-short-fiction/the-crystal-egg:the-crystal-egg:38:10e7d6a3eb44
        authority_tier: 2
        evidence_role: support
        relevance_note: >-
          The selected story mediates an extraordinary object through reported observation and assessment.
    counterexample_passages: []
    counterexample_search:
      witness_ids:
        - the-time-machine
        - selected-short-fiction/the-plattner-story
        - selected-short-fiction/the-crystal-egg
      dimensions: [frame-architecture]
      method: manual_close_reading
      coverage: targeted
      searched_passage_ids:
        - the-time-machine:xii:295:f1c0304026cb
        - selected-short-fiction/the-plattner-story:the-plattner-story:17:361fdbf88b7c
        - selected-short-fiction/the-crystal-egg:the-crystal-egg:24:99161d95fcc5
      outcome: no_material_counterexample
      notes: >-
        A targeted development search found changes in the source and stability of mediation, but each passage still makes testimony, transcription, or evidentiary assessment visible. No genuine resistant development passage was identified.
    control_results:
      - >-
        beetle-mediated-narrators: shared; explicit narration, case-book extraction,
        and compiled statements make mediation visible in the declared control role.
    scope_and_limits: >-
      Development-only cross_work scope is limited to frame architecture and testimony across the three cited development witnesses. This candidate records a bounded descriptive pattern in the retained witnesses and does not resolve the held-out witness.
    validation_expectation:
      heldout_targets:
        - id: tm-frame
          witness_id: the-time-machine
          role: frame architecture
        - id: star-testimony
          witness_id: selected-short-fiction/the-star
          role: testimony
      control_targets:
        - id: beetle-narrators
          witness_id: the-beetle
          role: multiple narrators
      heldout_tendency: >-
        The held-out frame and testimony targets should each show visible mediation of extraordinary events with credibility or uncertainty left in view.
      disconfirming_result: >-
        The proposed cross-role recurrence is disconfirmed if either held-out target lacks visible mediation or fails to keep evidentiary credibility and uncertainty in view.
      control_expectation: >-
        Metadata-only control expectation: the named control target tests whether multiple narration can account for the pattern without the declared frame-and-testimony combination.
    prohibited_overgeneralisation: >-
      Do not convert this bounded description into a universal account of Wells, a period-wide rule, or a prescription that fiction should use visible testimony frames.
    notes: >-
      Metrics are sampling context; direct passage reading governs interpretation. Moderate confidence reflects convergence across three independent development witnesses: the-time-machine, the-plattner-story, and the-crystal-egg. Controls remain unopened, so the classification is role_specific. The targeted counterexample search found variation in mediation but no genuine resistant development passage.

  - id: role-shaped-narrator-distance
    dimension: narrator-distance
    statement: >-
      Among the selected role-context passages, reported testimony interrupts remembered experience from the present telling, retrospective survival narration establishes documentary distance, and essay persona layers self-account with self-mockery.
    jurisdiction:
      scope: cross_work
      roles:
        - reported first-person account
        - retrospective first-person narration
        - essay voice
      eligible_witness_ids:
        - the-time-machine
        - the-island-of-doctor-moreau
        - certain-personal-matters
    classification: wells_characteristic_but_shared
    status: validated
    confidence: moderate
    supporting_passages:
      - witness_id: the-time-machine
        source_id: the-time-machine
        selection_id: null
        passage_id: the-time-machine:ix:247:7c7656f6a229
        authority_tier: 1
        evidence_role: support
        relevance_note: >-
          The reported first-person account separates remembered experience from its later presentation.
      - witness_id: the-island-of-doctor-moreau
        source_id: the-island-of-doctor-moreau
        selection_id: null
        passage_id: the-island-of-doctor-moreau:i:2:522a64e3a5eb
        authority_tier: 2
        evidence_role: support
        relevance_note: >-
          The retrospective survival narrative establishes distance between ordeal and narration.
      - witness_id: certain-personal-matters
        source_id: certain-personal-matters
        selection_id: null
        passage_id: certain-personal-matters:of-conversation:58:1e55fc6db37a
        authority_tier: 3
        evidence_role: support
        relevance_note: >-
          The essay voice addresses experience as conversational reflection rather than fictional testimony.
    counterexample_passages: []
    counterexample_search:
      witness_ids:
        - the-island-of-doctor-moreau
        - the-time-machine
        - certain-personal-matters
      dimensions: [narrator-distance]
      method: manual_close_reading
      coverage: targeted
      searched_passage_ids:
        - the-island-of-doctor-moreau:xxii:742:1a01256f2dfe
        - the-time-machine:iii:104:39e25a125192
        - certain-personal-matters:the-writing-of-essays:255:60e7e43f4b48
      outcome: no_material_counterexample
      notes: >-
        A targeted development search found materially different relations between present judgement and represented experience, but none removes narrator distance. The Moreau closing passage was therefore retained as related analytical history rather than resistant evidence.
    control_results:
      - >-
        beetle-role-shaped-distance: shared; three control narrators use different
        retrospective relations among experience, judgement, and self-presentation.
    scope_and_limits: >-
      Development-only cross_work scope is limited to the selected reported first-person, retrospective first-person, and essay passages across the-time-machine, the-island-of-doctor-moreau, and certain-personal-matters. Role and work are aliased in this sample, so the observed contrasts cannot identify a role effect or establish a general theory of narration.
    validation_expectation:
      heldout_targets:
        - id: tm-reported
          witness_id: the-time-machine
          role: reported first-person account
        - id: moreau-retrospective
          witness_id: the-island-of-doctor-moreau
          role: retrospective first-person narration
        - id: matters-essay
          witness_id: certain-personal-matters
          role: essay voice
      control_targets:
        - id: beetle-multiple
          witness_id: the-beetle
          role: multiple narrators
      heldout_tendency: >-
        The held-out targets should be assessed for the three bounded contrasts between represented experience and present narration described in the development passages.
      disconfirming_result: >-
        The claim is disconfirmed if the held-out targets converge on the same relation between represented experience and present narration and do not reproduce the bounded contrasts.
      control_expectation: >-
        Metadata-only control expectation: the named control target tests whether multiple narrators produce the same distance pattern independently of the three declared roles.
    prohibited_overgeneralisation: >-
      Do not treat these role-bound differences as universal properties of first-person writing, as a period-wide rule, or as a prescription for narrator distance.
    notes: >-
      Metrics are sampling context; direct passage reading governs interpretation. Confidence is tentative despite three independent witnesses because role and work are completely aliased and the targeted development search found substantial within-role variation. Controls remain unopened, so the classification is role_specific.

  - id: qualified-speculative-inference
    dimension: observation-inference
    statement: >-
      In the selected speculative-testimony and catastrophe passages, movement from observed detail to explanation is marked as provisional, revisable, or vulnerable to perceptual error.
    jurisdiction:
      scope: cross_work
      roles:
        - speculative method
        - evidence-to-speculation movement
      eligible_witness_ids:
        - the-time-machine
        - the-war-of-the-worlds
    classification: wells_characteristic_but_shared
    status: validated
    confidence: moderate
    supporting_passages:
      - witness_id: the-time-machine
        source_id: the-time-machine
        selection_id: null
        passage_id: the-time-machine:iv:147:5a08c0c8cfcb
        authority_tier: 1
        evidence_role: support
        relevance_note: >-
          The speculative method moves from observed conditions toward an explicitly qualified explanation.
      - witness_id: the-war-of-the-worlds
        source_id: the-war-of-the-worlds
        selection_id: null
        passage_id: the-war-of-the-worlds:i:10:dc75deedfa61
        authority_tier: 2
        evidence_role: support
        relevance_note: >-
          The catastrophe narrative records evidence before settling on an explanation of the event.
      - witness_id: the-war-of-the-worlds
        source_id: the-war-of-the-worlds
        selection_id: null
        passage_id: the-war-of-the-worlds:ii:27:b70ea6d8ec6a
        authority_tier: 2
        evidence_role: support
        relevance_note: >-
          Ogilvy initially attributes the sound to unequal cooling because he has not considered that the cylinder might be hollow.
    counterexample_passages:
      - witness_id: the-time-machine
        source_id: the-time-machine
        selection_id: null
        passage_id: the-time-machine:xi:264:2537c034e240
        authority_tier: 1
        evidence_role: variation
        relevance_note: >-
          Astronomical observations lead directly to a categorical tidal-drag explanation without local modal qualification or correction in the passage.
    control_results:
      - >-
        barbarians-romance-qualified-inference: shared; observed circumstances lead
        to competing, viewpoint-limited explanations in the control passage.
    scope_and_limits: >-
      Development-only cross_work scope is limited to speculative method and evidence-to-speculation movement in the-time-machine and the-war-of-the-worlds. This candidate concerns transitions from observation to explanation in the retained development passages and not the truth of the fictional explanations.
    validation_expectation:
      heldout_targets:
        - id: tm-speculation
          witness_id: the-time-machine
          role: speculative method
        - id: war-inference
          witness_id: the-war-of-the-worlds
          role: evidence-to-speculation movement
      control_targets:
        - id: barbarians-romance
          witness_id: the-british-barbarians
          role: scientific-romance control
      heldout_tendency: >-
        The held-out targets should mark at least some movement from observation to explanation as provisional, revisable, or perception-limited.
      disconfirming_result: >-
        The claim is disconfirmed if both held-out targets move from observation to explanation without qualification or revision.
      control_expectation: >-
        Metadata-only control expectation: the named control target tests whether qualified speculative inference is separable from a neighbouring scientific-romance convention.
    prohibited_overgeneralisation: >-
      Do not turn this bounded pattern into a universal feature of speculative narrative, a period-wide rule, or a prescription to qualify every fictional inference.
    notes: >-
      Metrics are sampling context; direct passage reading governs interpretation. Confidence is tentative because the support comes from only two independent development witnesses; the two War passages are not independent witnesses. Controls remain unopened, so the classification is role_specific.

  - id: qualified-scientific-exposition
    dimension: scientific-exposition
    statement: >-
      Across the selected role-context passages, scientific exposition links unfamiliar claims to observations, analogies, procedures, or classifications while retaining different local qualifications.
    jurisdiction:
      scope: cross_work
      roles:
        - speculative method
        - scientific argument
        - instructional exposition
        - comparison and classification
      eligible_witness_ids:
        - the-time-machine
        - the-island-of-doctor-moreau
        - text-book-of-biology-part-1
    classification: wells_characteristic_but_shared
    status: qualified
    confidence: moderate
    supporting_passages:
      - witness_id: the-time-machine
        source_id: the-time-machine
        selection_id: null
        passage_id: the-time-machine:v:165:29fe69fce8b4
        authority_tier: 1
        evidence_role: support
        relevance_note: >-
          An analogy defines the observer's epistemic limits and bounds the resulting general impression; it is not an explanatory procedure.
      - witness_id: the-island-of-doctor-moreau
        source_id: the-island-of-doctor-moreau
        selection_id: null
        passage_id: the-island-of-doctor-moreau:xiv:393:f95f34e93225
        authority_tier: 2
        evidence_role: support
        relevance_note: >-
          Moreau's scientific argument connects an unfamiliar claim to observation and analogy.
      - witness_id: text-book-of-biology-part-1
        source_id: text-book-of-biology-part-1
        selection_id: null
        passage_id: text-book-of-biology-part-1:2-the-theory-of-evolution:472:f51263a926c6
        authority_tier: 3
        evidence_role: support
        relevance_note: >-
          The instructional exposition qualifies a biological explanation through observed evidence.
      - witness_id: text-book-of-biology-part-1
        source_id: text-book-of-biology-part-1
        selection_id: null
        passage_id: text-book-of-biology-part-1:note-on-making-comparisons:527:75c6e3818b0d
        authority_tier: 3
        evidence_role: support
        relevance_note: >-
          The textbook passage makes comparison and classification explicit parts of explanation.
    counterexample_passages:
      - witness_id: the-time-machine
        source_id: the-time-machine
        selection_id: null
        passage_id: the-time-machine:xi:264:2537c034e240
        authority_tier: 1
        evidence_role: variation
        relevance_note: >-
          The tidal-drag account moves from astronomical observations to a categorical causal explanation with less local qualification.
    control_results:
      - >-
        days-qualified-scientific-exposition: shared; engineering comparison,
        recalculation, and acknowledged unknowns reproduce the broad expository
        combination outside Wells.
    scope_and_limits: >-
      Development-only cross_work scope is limited to selected speculative-method, scientific-argument, instructional-exposition, and comparison passages across the-time-machine, the-island-of-doctor-moreau, and text-book-of-biology-part-1. Role and work are aliased in this sample, so the contrast does not identify a role effect; nonfiction instruction is not fictional continuity evidence.
    validation_expectation:
      heldout_targets:
        - id: tm-exposition
          witness_id: the-time-machine
          role: speculative method
        - id: moreau-argument
          witness_id: the-island-of-doctor-moreau
          role: scientific argument
        - id: biology-instruction
          witness_id: text-book-of-biology-part-1
          role: instructional exposition
        - id: biology-comparison
          witness_id: text-book-of-biology-part-1
          role: comparison and classification
      control_targets:
        - id: days-technical
          witness_id: the-days-work
          role: technical-work control
      heldout_tendency: >-
        The held-out targets should connect unfamiliar claims to evidence, analogy, procedure, or classification while retaining the local qualifications described for each role-context passage.
      disconfirming_result: >-
        The proposed cross-role recurrence is disconfirmed if any held-out target either lacks an observable link, explanatory comparison, procedure, or classification, or presents that link without visible local qualification.
      control_expectation: >-
        Metadata-only control expectation: the named control target tests whether technical exposition supplies the same pattern outside the declared Wells roles.
    prohibited_overgeneralisation: >-
      Do not make this bounded descriptive comparison a universal rule for scientific exposition, a period-wide law, or a writing prescription to qualify every unfamiliar claim.
    notes: >-
      Metrics are sampling context; direct passage reading governs interpretation. Confidence is tentative despite three independent development witnesses because expository role and work are aliased and the devices are not independently replicated within each role. Controls remain unopened, so the classification is role_specific.

  - id: dialogue-pressure-varies-by-context
    dimension: dialogue-social-friction
    statement: >-
      Among the selected role-context passages, village group talk is distributed across brief voices, a coercive exchange pairs a broken threat with a long appeasing reply, and argument under danger takes the form of one extended ordered speech.
    jurisdiction:
      scope: cross_work
      roles:
        - social register
        - sustained dialogue
        - dialogue under stress
      eligible_witness_ids:
        - the-invisible-man
        - the-island-of-doctor-moreau
    classification: wells_characteristic_but_shared
    status: validated
    confidence: moderate
    supporting_passages:
      - witness_id: the-invisible-man
        source_id: the-invisible-man
        selection_id: null
        passage_id: the-invisible-man:iii:92:8c3779ecfb78
        authority_tier: 2
        evidence_role: support
        relevance_note: >-
          Social register is carried through group talk with distributed turns and reactions.
      - witness_id: the-invisible-man
        source_id: the-invisible-man
        selection_id: null
        passage_id: the-invisible-man:ix:342:8ec129f34188
        authority_tier: 2
        evidence_role: support
        relevance_note: >-
          Sustained dialogue uses repeated turns and interruption under continuing social pressure.
      - witness_id: the-island-of-doctor-moreau
        source_id: the-island-of-doctor-moreau
        selection_id: null
        passage_id: the-island-of-doctor-moreau:xiii:366:c305934608be
        authority_tier: 2
        evidence_role: support
        relevance_note: >-
          Under danger, Moreau delivers one extended ordered speech that combines tests, character evidence, and a rhetorical question.
    counterexample_passages:
      - witness_id: the-invisible-man
        source_id: the-invisible-man
        selection_id: null
        passage_id: the-invisible-man:xiii:444:6e6a04602732
        authority_tier: 2
        evidence_role: variation
        relevance_note: >-
          A later exchange reduces the sustained turn pressure and changes the balance of social response.
    control_results:
      - >-
        desert-group-dialogue: shared; a control scene distributes group talk across
        several speakers, gesture, document handling, and laughter.
    scope_and_limits: >-
      Development-only cross_work scope is limited to the selected social-register, sustained-dialogue, and danger-context passages in the-invisible-man and the-island-of-doctor-moreau. The contexts and works are aliased, so the contrasts do not identify pressure or role as their cause and do not prescribe a single dialogue form.
    validation_expectation:
      heldout_targets:
        - id: invisible-dialogue
          witness_id: the-invisible-man
          role: sustained dialogue
        - id: moreau-stress
          witness_id: the-island-of-doctor-moreau
          role: dialogue under stress
      control_targets:
        - id: desert-group
          witness_id: a-desert-drama
          role: group dialogue
      heldout_tendency: >-
        The held-out targets should be compared for bounded contrasts in turn length, repetition, silence, gesture, and ordered speech without assuming that pressure causes those contrasts.
      disconfirming_result: >-
        The claim is disconfirmed if the held-out passages converge on the same local organisation and provide no contrast comparable to the development passages.
      control_expectation: >-
        Metadata-only control expectation: the named control target tests whether group dialogue alone accounts for the observed distribution of turns and reactions.
    prohibited_overgeneralisation: >-
      Do not treat these selected passage differences as universal dialogue laws, a period-wide rule, or a prescription for how fictional conversations should be shaped.
    notes: >-
      Metrics are sampling context; direct passage reading governs interpretation. Confidence is tentative because only two independent development witnesses are represented and the Invisible Man supplies substantial within-role variation. Controls remain unopened, so the classification is role_specific.

