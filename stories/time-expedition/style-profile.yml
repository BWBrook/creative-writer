  - id: diagnostic-repeated-phrases
    name: Repeated phrase diagnostic
    family: diagnostic
    advisory: review
    claim_ids: []
    roles: []
    scope: story
    evaluation_mode: contextual_diagnostic
    review_question: Is this repeated phrase a deliberate motif or an unnoticed reusable sentence component?
    signal:
      kind: repeated_ngram
      ngram_size: 3
      minimum_occurrences: 3
      minimum_words: 300
      stop_words:
        - "the"
        - "a"
        - "an"
        - "and"
        - "but"
        - "if"
        - "in"
        - "of"
        - "on"
        - "to"
    source_passage_ids: []
    variation_passage_ids: []
    control_passage_ids: []
    packet_ids: []
    interpretation_limits: This signal is a locator, not a Wells requirement; repetition may be deliberate structure, testimony, or motif.
