    interpretation_limits: >-
      Development-only cross_work scope is limited to the selected social-register, sustained-dialogue, and danger-context passages in the-invisible-man and the-island-of-doctor-moreau. The contexts and works are aliased, so the contrasts do not identify pressure or role as their cause and do not prescribe a single dialogue form. Prohibited overgeneralisation: Do not treat these selected passage differences as universal dialogue laws, a period-wide rule, or a prescription for how fictional conversations should be shaped.
