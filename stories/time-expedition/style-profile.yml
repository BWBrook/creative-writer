roles:
  - id: frame
    label: Frame
    description: The outer chain through which testimony, records, and judgements reach the reader.
    phase_2b_roles:
      - frame architecture
      - testimony
  - id: reported-account
    label: Reported account
    description: The Time Traveller's remembered first-person experience as delivered through a later telling.
    phase_2b_roles:
      - reported first-person account
      - retrospective first-person narration
  - id: notebook
    label: Notebook
    description: A documentary record that mediates the Traveller's account through testimony and reported experience.
    phase_2b_roles:
      - testimony
      - reported first-person account
  - id: scientific-inference
    label: Scientific inference
    description: Observed particulars moving into provisional explanation, revision, or bounded conjecture.
    phase_2b_roles:
      - speculative method
      - evidence-to-speculation movement
      - landscape observation
      - microscopic observation
  - id: scientific-exposition
    label: Scientific exposition
    description: Scene-pressured explanation using observation, analogy, procedure, comparison, or classification.
    phase_2b_roles:
      - speculative method
      - scientific argument
      - instructional exposition
      - comparison and classification
      - biological terminology
  - id: social-dialogue
    label: Social dialogue
    description: Speech shaped by occupation, status, disagreement, danger, misunderstanding, or comic friction.
    phase_2b_roles:
      - social register
      - sustained dialogue
      - dialogue under stress
      - comic friction
      - humour
  - id: danger-action
    label: Danger and action
    description: Biological or catastrophic danger disclosed through selected observation before and during action.
    phase_2b_roles:
      - biological danger
      - catastrophe
      - landscape observation
      - biological terminology
  - id: reflection-closure
    label: Reflection and closure
    description: The ending of an available record while uncertainty or larger implication remains in view.
    phase_2b_roles:
      - frame architecture
      - short-form architecture
rules:
  - id: practice-mediated-testimony
    name: Mediated testimony
    family: practice
    advisory: review
    claim_ids:
      - mediated-testimony-frame
    roles:
      - frame
      - notebook
    scope: story
    evaluation_mode: manual_question
    review_question: Does the extraordinary claim reach the reader through a legible chain of witnessing, telling, record, or contest rather than unmediated authorial assertion?
    source_passage_ids:
      - the-time-machine:ii:101:b859a93fec21
      - selected-short-fiction/the-plattner-story:the-plattner-story:1:725f01ec6e50
    variation_passage_ids:
      - the-time-machine:ii:79:3f712a420f66
    control_passage_ids: []
    packet_ids:
      - frame-and-testimony
    interpretation_limits: >-
      Development-only cross_work scope is limited to frame architecture and testimony across the three cited development witnesses. This candidate records a bounded descriptive pattern in the retained witnesses and does not resolve the held-out witness. Prohibited overgeneralisation: Do not convert this bounded description into a universal account of Wells, a period-wide rule, or a prescription that fiction should use visible testimony frames.
  - id: practice-role-shaped-distance
    name: Role-shaped narrator distance
    family: practice
    advisory: review
    claim_ids:
      - role-shaped-narrator-distance
    roles:
      - reported-account
      - notebook
    scope: chapter
    evaluation_mode: manual_question
    review_question: Does narrator distance suit the current role, and are shifts between remembered experience, present telling, and reflective hindsight legible?
    source_passage_ids:
      - the-time-machine:ix:247:7c7656f6a229
      - the-time-machine:xii:276:23b26487ff8e
    variation_passage_ids:
      - the-island-of-doctor-moreau:i:2:522a64e3a5eb
    control_passage_ids: []
    packet_ids:
      - traveller-account
    interpretation_limits: >-
      Development-only cross_work scope is limited to the selected reported first-person, retrospective first-person, and essay passages across the-time-machine, the-island-of-doctor-moreau, and certain-personal-matters. Role and work are aliased in this sample, so the observed contrasts cannot identify a role effect or establish a general theory of narration. Prohibited overgeneralisation: Do not treat these role-bound differences as universal properties of first-person writing, as a period-wide rule, or as a prescription for narrator distance.
  - id: practice-qualified-inference
    name: Qualified speculative inference
    family: practice
    advisory: review
    claim_ids:
      - qualified-speculative-inference
    roles:
      - scientific-inference
    scope: passage
    evaluation_mode: manual_question
    review_question: Does inference proceed from observed particulars through provisional explanation, with uncertainty or correction where the evidence demands it?
    source_passage_ids:
      - the-time-machine:iv:147:5a08c0c8cfcb
    variation_passage_ids: []
    control_passage_ids: []
    packet_ids:
      - observation-and-exposition
    interpretation_limits: >-
      Development-only cross_work scope is limited to speculative method and evidence-to-speculation movement in the-time-machine and the-war-of-the-worlds. This candidate concerns transitions from observation to explanation in the retained development passages and not the truth of the fictional explanations. Prohibited overgeneralisation: Do not turn this bounded pattern into a universal feature of speculative narrative, a period-wide rule, or a prescription to qualify every fictional inference.
  - id: locator-qualified-inference
    name: Qualified inference locator
    family: practice
    advisory: notice
    claim_ids:
      - qualified-speculative-inference
    roles:
      - scientific-inference
    scope: passage
    evaluation_mode: locator
    review_question: Where do qualifying terms occur, and do they mark genuine epistemic limits rather than habitual hedging?
    signal:
      kind: lexicon_locator
      terms:
        - perhaps
        - probably
        - possibly
        - apparently
        - evidently
        - seemed
        - suppose
        - conjecture
      max_examples: 8
    source_passage_ids:
      - the-time-machine:iv:147:5a08c0c8cfcb
    variation_passage_ids: []
    control_passage_ids: []
    packet_ids:
