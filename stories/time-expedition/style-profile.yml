    roles:
      - social-dialogue
    scope: chapter
    evaluation_mode: manual_question
    review_question: Is dialogue pressure suited to social and occupational context, with disagreement enacted through role and status rather than interchangeable exposition?
    source_passage_ids:
      - the-invisible-man:iii:92:8c3779ecfb78
      - the-invisible-man:vii:223:04a2271ebbf5
    variation_passage_ids:
