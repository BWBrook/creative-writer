prohibited_uses:
  - Do not use selected short fiction, The War of the Worlds, or the Tier 4 control as Time Expedition continuity.
  - Do not import Martian inventions, unselected stories, control incidents, or control ideology.
  - Do not let a Tier 2 source override The Time Machine.
  - Do not use the Tier 4 control for style prescription or phrase borrowing.
  - Do not turn consequence-before-recognition into a universal suspense law or a requirement to delay every explanation.
anti_copying_guidance: Study narrative method, evidentiary sequence, role, and cadence. Do not borrow distinctive phrases, sentence skeletons, images, or local wording.
