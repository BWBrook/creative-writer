prohibited_uses:
  - Do not use The Invisible Man, The Island of Doctor Moreau, or the Tier 4 control as Time Expedition continuity.
  - Do not import Invisible Man or Moreau characterisation, inventions, or frame architecture.
  - Do not let a Tier 2 source override The Time Machine.
  - Do not use the Tier 4 control for style prescription or phrase borrowing.
  - Do not convert local turn patterns, class markers, or comic mismatch into a universal dialogue formula.
anti_copying_guidance: Study narrative method, evidentiary sequence, role, and cadence. Do not borrow distinctive phrases, sentence skeletons, images, or local wording.
