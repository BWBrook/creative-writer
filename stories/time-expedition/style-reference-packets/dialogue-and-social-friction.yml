    kind: positive_example
    claim_ids:
      - humour-through-social-friction
    authority_tier: 2
    permitted_use: dialogue and social-style comparison
    selection_note: A ceremonious response collides with an agitated report, making social mismatch carry the humour.
  - id: invisible-man-demand-and-interruption
    passage_id: the-invisible-man:vii:223:04a2271ebbf5
    kind: positive_example
    claim_ids:
      - dialogue-pressure-varies-by-context
      - role-shaped-syntax
    authority_tier: 2
    permitted_use: dialogue and social-style comparison
    selection_note: A long repetitive demand accumulates pressure before gesture and a compact command contract and stop the exchange.
  - id: moreau-stress-variation
    passage_id: the-island-of-doctor-moreau:v:115:8ddf9cdc824d
    kind: authentic_variation
