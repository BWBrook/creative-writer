prohibited_uses:
  - Do not use later-adaptation material or unsupported generalisation from one passage.
  - Do not treat selected short fiction or the Tier 4 control as Time Expedition continuity.
  - Do not let selected short fiction override The Time Machine or use unselected stories.
  - Do not use the Tier 4 control for style prescription or phrase borrowing.
anti_copying_guidance: Study narrative method, evidentiary sequence, role, and cadence. Do not borrow distinctive phrases, sentence skeletons, images, or local wording.
