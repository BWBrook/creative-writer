prohibited_uses:
  - Do not use selected short fiction or the Tier 4 control as Time Expedition continuity.
  - Do not import unselected stories, control characters, places, incidents, lost-world content, imperial assumptions, or racial ideology.
  - Do not let selected short fiction or a control override The Time Machine.
  - Do not use the Tier 4 control for style prescription or phrase borrowing.
  - Do not turn unresolved implication into a universal ending rule or proof of Wellsian distinctiveness.
anti_copying_guidance: Study narrative method, evidentiary sequence, role, and cadence. Do not borrow distinctive phrases, sentence skeletons, images, or local wording.
