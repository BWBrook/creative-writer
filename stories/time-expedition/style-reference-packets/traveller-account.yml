prohibited_uses:
  - Do not import Moreau characters or inventions or use Moreau as Time Expedition continuity.
  - Do not let The Island of Doctor Moreau override The Time Machine.
  - Do not turn role-bound distance or local syntax into a fixed cadence, universal first-person rule, or period-wide prescription.
  - Do not copy local wording.
anti_copying_guidance: Study narrative method, evidentiary sequence, role, and cadence. Do not borrow distinctive phrases, sentence skeletons, images, or local wording.
